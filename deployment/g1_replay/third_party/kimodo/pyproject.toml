[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kimodo-inference-runtime"
version = "1.0.0+deployment"
description = "Trimmed Apache-2.0 Kimodo inference runtime from the audited S4000 snapshot"
requires-python = ">=3.10"
dependencies = [
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "numpy>=1.23,<2",
  "scipy>=1.10",
  "transformers==5.1.0",
  "peft>=0.18",
  "einops>=0.7",
  "huggingface-hub>=1.0",
  "safetensors>=0.4",
]

[tool.setuptools.packages.find]
include = ["kimodo*"]

[tool.setuptools.package-data]
kimodo = ["assets/skeletons/g1skel34/xml/g1.xml"]

